<div class="proto-bar">

  <a href="inline.html?s=1">On-page 1 · Desktop</a>

  <div class="phone">
    <iframe id="screen" class="phone-frame" title="Mobile product page"></iframe>
  </div>
</div>

<script src="offer.js"></script>
<script>
  // The mobile view is the same responsive page, shown at phone width.
  const s = new URLSearchParams(location.search).get('s') === '2' ? '2' : '1';
  document.getElementById('screen').src = 'inline.html?s=' + s + '&embed=1';
  document.querySelectorAll('.proto-bar a').forEach((a) => { if (a.getAttribute('href') === 'inline-mobile.html?s=' + s) a.setAttribute('aria-current', 'page'); });
  initProtoBar();
</script>
