<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose and Choose · Bag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="proto-bar">
  <strong>Choose and Choose · wireframe</strong>
  <a href="index.html">Drawer · Desktop</a>
  <a href="mobile.html">Drawer · Mobile</a>
  <a href="inline.html?s=1">On-page 1 · Desktop</a>
  <a href="inline.html?s=2">On-page 2 · Desktop</a>
  <a href="inline-mobile.html?s=1">On-page 1 · Mobile</a>
  <a href="inline-mobile.html?s=2">On-page 2 · Mobile</a>
  <a href="bag.html" aria-current="page">Bag</a>
  <button type="button" data-notes>Toggle notes</button>
  <button type="button" data-reset>Reset</button>
</div>

<main class="bag-stage" id="bag"></main>

<script src="offer.js"></script>
<script src="inline.js"></script>
<script>
  initProtoBar();
  const from = new URLSearchParams(location.search).get('from');
  const pdp = { mobile: 'mobile.html', s1: 'inline.html?s=1', s2: 'inline.html?s=2' }[from] || 'index.html';
  const bag = document.getElementById('bag');

  // On-page version: scenario 1 (this product + a claimed gift) or 2 (selected items + one automatic gift).
  const lineHtml = (name, sub, price, isGift) => '<div class="bag-line"><div class="ph">' + (isGift ? 'GIFT' : '') + '</div><div class="info"><span class="name">' + name + '</span>' +
    '<span class="sub">' + sub + '</span></div><span' + (isGift ? ' class="free"' : '') + '>' + price + '</span></div>';

  function renderOnpageBag() {
    const req = ONPAGE.required;
    let lines = '', count = 0, notice = '', qualifies = false;
    if (from === 's1') {
      const s = onpage.s1;
      const gift = ONPAGE.gifts.find((g) => g.id === s.bagGift);
      qualifies = s.bagQty >= req;
      count = s.bagQty + (gift && qualifies ? 1 : 0);
      if (s.bagQty) lines += lineHtml(ONPAGE.product.name, ONPAGE.product.sub + ' · Qty ' + s.bagQty, ONPAGE.product.price);
      if (gift && qualifies) lines += lineHtml(gift.name, 'Free gift · ' + gift.worth, 'FREE', true);
      if (!s.bagQty) notice = '';
      else if (!qualifies) notice = '<div class="notice warn"><strong>Add ' + plural(req - s.bagQty, 'more') + ' ' + ONPAGE.product.name + ' to claim a free gift.</strong><a href="' + pdp + '">See the gifts</a></div>';
      else if (!gift) notice = '<div class="notice warn"><strong>You qualify for a free gift but haven\u2019t claimed one.</strong><a href="' + pdp + '#claim">Choose your gift</a></div>';
      else notice = '<div class="notice ok">Free gift claimed with your ' + ONPAGE.product.name + '.</div>';
    } else {
      const total = s2Total();
      qualifies = total >= req;
      count = total + (qualifies ? 1 : 0);
      ONPAGE.products.forEach((p) => {
        const n = onpage.s2.added[p.id];
        if (n) lines += lineHtml(p.name, p.sub + ' · Qty ' + n, p.price);
      });
      if (qualifies) lines += lineHtml(ONPAGE.gift.name, 'Free gift · added automatically', 'FREE', true);
      if (total && !qualifies) notice = '<div class="notice warn"><strong>Add ' + plural(req - total, 'more item') + ' from the offer to get ' + ONPAGE.gift.name + ' free.</strong><a href="' + pdp + '#claim">See the selected items</a></div>';
      else if (qualifies) notice = '<div class="notice ok">' + ONPAGE.gift.name + ' added free.</div>';
    }
    const noun = from === 's2' ? 'basket' : 'bag';
    let html = '<h1>Your ' + noun + ' (' + count + ')</h1>';
    if (!count) { bag.innerHTML = html + '<p class="hint">Your ' + noun + ' is empty. <a href="' + pdp + '">Back to the product</a></p>'; return; }
    html += notice + '<div class="offer-group"><div class="group-head"><span>' + (qualifies ? 'CHOOSE &amp; CHOOSE OFFER' : 'YOUR ITEMS') + '</span><a href="' + pdp + '#claim">Edit</a></div>' + lines + '</div>' +
      '<div class="totals"><div><span>Subtotal</span><span>[SUBTOTAL]</span></div>' + (qualifies ? '<div class="free"><span>Gift savings</span><span>\u2212£XX.XX</span></div>' : '') + '</div>' +
      '<button type="button" class="btn-primary">CHECKOUT</button>';
    bag.innerHTML = html;
  }

  function renderBag() {
    if (from === 's1' || from === 's2') { renderOnpageBag(); return; }
    const chosen = OFFER.products.filter((p) => state.qty[p.id] > 0);
    const gifts = OFFER.gifts.filter((g) => state.picked.includes(g.id));
    const complete = isComplete();
    const count = totalChosen() + gifts.length;

    let html = '<h1>Your bag (' + count + ')</h1>';
    if (chosen.length === 0) {
      html += '<p class="hint">Your bag is empty. <a href="' + pdp + '">Back to the product</a></p>';
      bag.innerHTML = html;
      return;
    }
    if (complete && gifts.length) {
      html += '<div class="notice ok">Choose &amp; Choose offer added: your gift is free.</div>';
    } else if (!complete && gifts.length) {
      html += '<div class="notice warn"><span class="note" aria-hidden="true">!</span>' +
        '<strong>Your offer needs ' + plural(remaining(), 'more product') + ' to keep your free gift.</strong>' +
        '<a href="' + pdp + '?offer=open">Choose a product</a></div>';
    }

    html += '<div class="offer-group"><div class="group-head"><span>CHOOSE &amp; CHOOSE OFFER</span><a href="' + pdp + '?offer=open">Edit offer</a></div>';
    html += chosen.map((p) =>
      '<div class="bag-line"><div class="ph"></div><div class="info"><span class="name">' + p.name + '</span>' +
      '<span class="sub">' + p.sub + ' · Qty ' + state.qty[p.id] + '</span>' +
      '<button type="button" class="link-btn" data-remove="' + p.id + '" style="align-self:flex-start">Remove one</button></div>' +
      '<span>' + p.price + '</span></div>').join('');
    html += gifts.map((g) =>
      '<div class="bag-line' + (complete ? '' : ' on-hold') + '"><div class="ph">GIFT</div><div class="info"><span class="name">' + g.name + '</span>' +
      '<span class="sub">Free gift · ' + g.worth + (complete ? '' : ' · on hold') + '</span></div><span class="free">FREE</span></div>').join('');
    html += '</div>';

    html += '<div class="totals"><div><span>Subtotal</span><span>[SUBTOTAL]</span></div>' +
      '<div class="free"><span>Gift savings</span><span>−£XX.XX</span></div></div>' +
      '<button type="button" class="btn-primary"' + (complete ? '' : ' disabled') + '>CHECKOUT</button>';
    bag.innerHTML = html;
  }

  bag.addEventListener('click', (e) => {
    const t = e.target.closest('[data-remove]');
    if (!t) return;
    const id = t.dataset.remove;
    state.qty[id] = Math.max((state.qty[id] || 0) - 1, 0);
    state.step = 1;
    saveState();
    renderBag();
  });

  renderBag();
</script>
</body>
</html>
