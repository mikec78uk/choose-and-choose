<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose and Choose · Bag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="proto-bar">
  <strong>Choose and Choose · earlier drawer version</strong>
  <a href="index.html">All scenarios</a>
  <a href="drawer.html">Drawer · Desktop</a>
  <a href="mobile.html">Drawer · Mobile</a>
  <a href="bag.html" aria-current="page">Bag</a>
  <button type="button" data-notes>Toggle notes</button>
  <button type="button" data-reset>Reset</button>
</div>

<main class="bag-stage" id="bag"></main>

<script src="offer.js"></script>
<script src="unified.js"></script>
<script>
  initProtoBar();
  const from = new URLSearchParams(location.search).get('from');
  const unified = new URLSearchParams(location.search).has('s');
  const pdp = unified ? 'pdp.html?s=' + SC : from === 'mobile' ? 'mobile.html' : 'drawer.html';
  const bag = document.getElementById('bag');

  // Unified version: what's in the basket for this scenario, plus the gift state.
  function renderUnifiedBag() {
    const b = basket();
    const unlocked = isUnlocked();
    const gifts = claimedGifts().map(giftById);
    const left = CFG.required - offerCount();
    const edit = pdp + (SC === 3 ? '&offer=open' : '') + '#unlock';
    const lines = Object.keys(b.items).map((id) => {
      const p = OFFER.products.find((x) => x.id === id);
      return '<div class="bag-line"><div class="ph"></div><div class="info"><span class="name">' + p.name + '</span>' +
        '<span class="sub">' + p.sub + ' · Qty ' + b.items[id] + '</span>' +
        '<button type="button" class="link-btn" data-remove="' + id + '" style="align-self:flex-start">Remove one</button></div><span>' + p.price + '</span></div>';
    }).join('') + gifts.map((g) =>
      '<div class="bag-line' + (unlocked ? '' : ' on-hold') + '"><div class="ph">GIFT</div><div class="info"><span class="name">' + g.name + '</span>' +
      '<span class="sub">Free gift · ' + g.worth + (unlocked ? '' : ' · reserved') + '</span></div><span class="free">FREE</span></div>').join('');

    let notice = '';
    if (!unlocked && (gifts.length && !AUTO_GIFT)) notice = '<div class="notice warn"><strong>Add ' + plural(left, 'more qualifying product') + ' to get your reserved gift.</strong><a href="' + edit + '">See the offer</a></div>';
    else if (!unlocked && offerCount()) notice = '<div class="notice warn"><strong>Add ' + plural(left, 'more qualifying product') + ' to unlock a free gift.</strong><a href="' + edit + '">See the offer</a></div>';
    else if (unlocked && !gifts.length) notice = '<div class="notice warn"><strong>You\u2019ve unlocked a free gift but haven\u2019t chosen it yet.</strong><a href="' + edit + '">Choose your gift</a></div>';
    else if (unlocked) notice = '<div class="notice ok">Choose &amp; Choose offer applied: your gift' + (gifts.length > 1 ? 's are' : ' is') + ' free.</div>';

    const count = basketCount();
    let html = '<h1>Your basket (' + count + ')</h1>';
    if (!Object.keys(b.items).length) { bag.innerHTML = html + '<p class="hint">Your basket is empty. <a href="' + pdp + '">Back to the product</a></p>'; return; }
    html += notice + '<div class="offer-group"><div class="group-head"><span>' + (unlocked ? 'CHOOSE &amp; CHOOSE OFFER' : 'YOUR ITEMS') + '</span><a href="' + edit + '">Edit offer</a></div>' + lines + '</div>' +
      '<div class="totals"><div><span>Subtotal</span><span>[SUBTOTAL]</span></div>' + (unlocked && gifts.length ? '<div class="free"><span>Gift savings</span><span>\u2212£XX.XX</span></div>' : '') + '</div>' +
      '<button type="button" class="btn-primary">CHECKOUT</button>';
    bag.innerHTML = html;
  }

  function renderBag() {
    if (unified) { renderUnifiedBag(); return; }
    const chosen = OFFER.products.filter((p) => state.qty[p.id] > 0);
    const gifts = OFFER.gifts.filter((g) => state.picked.includes(g.id));
    const complete = isComplete();
    const count = totalChosen() + gifts.length;

    let html = '<h1>Your bag (' + count + ')</h1>';
    if (chosen.length === 0) {
      html += '<p class="hint">Your bag is empty. <a href="' + pdp + '">Back to the product</a></p>';
      bag.innerHTML = html;
      return;
    }
    if (complete && gifts.length) {
      html += '<div class="notice ok">Choose &amp; Choose offer added: your gift is free.</div>';
    } else if (!complete && gifts.length) {
      html += '<div class="notice warn"><span class="note" aria-hidden="true">!</span>' +
        '<strong>Your offer needs ' + plural(remaining(), 'more product') + ' to keep your free gift.</strong>' +
        '<a href="' + pdp + '?offer=open">Choose a product</a></div>';
    }

    html += '<div class="offer-group"><div class="group-head"><span>CHOOSE &amp; CHOOSE OFFER</span><a href="' + pdp + '?offer=open">Edit offer</a></div>';
    html += chosen.map((p) =>
      '<div class="bag-line"><div class="ph"></div><div class="info"><span class="name">' + p.name + '</span>' +
      '<span class="sub">' + p.sub + ' · Qty ' + state.qty[p.id] + '</span>' +
      '<button type="button" class="link-btn" data-remove="' + p.id + '" style="align-self:flex-start">Remove one</button></div>' +
      '<span>' + p.price + '</span></div>').join('');
    html += gifts.map((g) =>
      '<div class="bag-line' + (complete ? '' : ' on-hold') + '"><div class="ph">GIFT</div><div class="info"><span class="name">' + g.name + '</span>' +
      '<span class="sub">Free gift · ' + g.worth + (complete ? '' : ' · on hold') + '</span></div><span class="free">FREE</span></div>').join('');
    html += '</div>';

    html += '<div class="totals"><div><span>Subtotal</span><span>[SUBTOTAL]</span></div>' +
      '<div class="free"><span>Gift savings</span><span>−£XX.XX</span></div></div>' +
      '<button type="button" class="btn-primary"' + (complete ? '' : ' disabled') + '>CHECKOUT</button>';
    bag.innerHTML = html;
  }

  bag.addEventListener('click', (e) => {
    const t = e.target.closest('[data-remove]');
    if (!t) return;
    if (unified) { removeItem(t.dataset.remove); saveUnified(); renderBag(); return; }
    const id = t.dataset.remove;
    state.qty[id] = Math.max((state.qty[id] || 0) - 1, 0);
    state.step = 1;
    saveState();
    renderBag();
  });

  renderBag();
</script>
</body>
</html>
